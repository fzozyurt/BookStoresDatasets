name: Haftalık Dashboard ve Pages Yayını

on:
  schedule:
    - cron: '0 10 * * 0'  # Her Pazar saat 10:00 UTC
  workflow_dispatch:  # Manuel tetikleme

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

jobs:
  dashboard:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (plotly dahil)
        run: uv sync --frozen --extra report

      - name: Download datasets from Kaggle
        run: |
          mkdir -p Data
          uv run kaggle datasets download -d "${{ vars.KAGGLE_DATASET_BKM }}" -p Data --unzip || true
          uv run kaggle datasets download -d "${{ vars.KAGGLE_DATASET_KY }}" -p Data --unzip || true
          mv -f Data/BKM_Datasets.csv Data/bkm_Datasets.csv || true
          mv -f Data/KY_Datasets.csv Data/kitapyurdu_Datasets.csv || true

      - name: Generate dashboard
        run: uv run bookdata report -o Report/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
