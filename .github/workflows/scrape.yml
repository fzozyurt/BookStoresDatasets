name: Kazıma ve Kaggle Güncelleme

on:
  schedule:
    - cron: '0 6,18 * * *'  # Günde iki kez (UTC) — şimdilik yalnızca BKM
  workflow_dispatch:        # Manuel tetikleme; store seçilebilir
    inputs:
      store:
        description: 'Hangi mağaza kazınsın?'
        type: choice
        options:
          - all
          - bkm
        default: all

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - store: bkm
            dataset_var: KAGGLE_DATASET_BKM
            dataset_file: bkm_Datasets.csv
    env:
      BOOKDATA_STORE: ${{ matrix.store }}
      BOOKDATA_LOG_DIR: logs
      BOOKDATA_RESPECT_ROBOTS: "true"
      BOOKDATA_KAGGLE_DATASET: ${{ vars[matrix.dataset_var] }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      # matrix bağlamı job-level 'if'te kullanılamadığı için seçim filtreleri
      # step'lere uygulanır. CRON / 'all' → tüm mağazalar; belirli seçim → sadece o.
      - name: Install dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.store == 'all' || github.event.inputs.store == matrix.store }}
        run: uv sync --frozen

      # Kaggle'daki dosya adı kodla birebir aynı (bkm_Datasets.csv); mv gerekmez.
      - name: Download previous dataset from Kaggle
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.store == 'all' || github.event.inputs.store == matrix.store }}
        run: |
          mkdir -p Data
          uv run kaggle datasets download -d "$BOOKDATA_KAGGLE_DATASET" -p Data --unzip

      - name: Scrape and update dataset
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.store == 'all' || github.event.inputs.store == matrix.store }}
        run: uv run bookdata scrape "${{ matrix.store }}"

      - name: Publish dataset to Kaggle
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.store == 'all' || github.event.inputs.store == matrix.store }}
        run: uv run bookdata publish "${{ matrix.store }}"

      - name: Commit logs
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.store == 'all' || github.event.inputs.store == matrix.store }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add logs/
          if ! git diff --cached --quiet; then
            git commit -m "Kazıma logları - ${{ matrix.store }} - $(date +'%Y-%m-%d')"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
