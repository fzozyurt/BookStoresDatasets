name: CI

on:
  push:            # Her push'ta (tüm branch'ler) test koşar
  pull_request:
  workflow_dispatch:  # Actions sekmesinden manuel çalıştırılabilir

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --frozen --extra report

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Test
        run: uv run pytest
