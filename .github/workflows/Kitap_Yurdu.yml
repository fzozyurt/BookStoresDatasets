name: Kitapyurdu Kazıma ve Kaggle Güncelleme

on:
  schedule:
    - cron: '0 6,18 * * *'  # Günde iki kez (UTC), BKM'den farklı saatte
  workflow_dispatch:  # Manuel tetikleme

permissions:
  contents: write

env:
  STORE: kitapyurdu
  DATASET: ${{ vars.KAGGLE_DATASET_KY }}
  DATASET_FILE: KY_Datasets.csv
  LOCAL_FILE: kitapyurdu_Datasets.csv

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      BOOKDATA_STORE: ${{ env.STORE }}
      BOOKDATA_LOG_DIR: logs
      BOOKDATA_RESPECT_ROBOTS: "true"
      BOOKDATA_KAGGLE_DATASET: ${{ env.DATASET }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Download previous dataset from Kaggle
        run: |
          mkdir -p Data
          if uv run kaggle datasets download -d "$DATASET" -p Data --unzip; then
            mv "Data/$DATASET_FILE" "Data/$LOCAL_FILE"
          fi

      - name: Scrape and update dataset
        run: uv run bookdata scrape "$STORE"

      - name: Publish dataset to Kaggle
        run: uv run bookdata publish "$STORE"

      - name: Commit logs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add logs/
          if ! git diff --cached --quiet; then
            git commit -m "Günlük kazıma logları - $STORE - $(date +'%Y-%m-%d')"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
